; Build:  pio run -d ports/esp32 -e esp32 -t upload      (or -e esp32s3)
; Set your display driver/pins for TFT_eSPI with -D flags below (example: ILI9341 240x320).
[platformio]
src_dir = .
[env]
framework = arduino
lib_deps = bodmer/TFT_eSPI
build_src_filter = +<esp32_main.cpp> +<../../main.cpp>
build_flags = -I. -I../.. -DPD_PORT -DPD_SAVE=0 -DPD_SOUND=0 -O2
  -DUSER_SETUP_LOADED=1 -DILI9341_DRIVER=1 -DTFT_WIDTH=240 -DTFT_HEIGHT=320
  -DTFT_MISO=19 -DTFT_MOSI=23 -DTFT_SCLK=18 -DTFT_CS=5 -DTFT_DC=2 -DTFT_RST=4 -DSPI_FREQUENCY=40000000
[env:esp32]
platform = espressif32
board = esp32dev
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
